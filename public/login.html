<body>
<div id="scrollProgress"></div>

<!-- PRELOADER -->

    <div class="preloader-particles" id="preloaderParticles"></div>
    
    <div class="preloader-content">
      <div class="preloader-logo">FARMERS FARM</div>
      <div class="preloader-sub">Brewing Excellence Since 2020</div>
      
      <!-- Progress Bar -->
      <div class="preloader-bar">
        <div class="preloader-bar-inner"></div>
        <div class="preloader-bar-glow"></div>
      </div>
      
      <div class="preloader-tip">☕ Farm to Cup — 100% Natural</div>
    </div>

<!-- NAV -->
<nav>
  <div class="nav-logo" onclick="window.location.href='/'" style="cursor:pointer;">
    <span>FARMERS FARM</span>
    <span>Est. 2020 · Pure Harvest</span>
  </div>
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
  <ul class="nav-links">
    <li><a href="/#about">About</a></li>
    <li><a href="/#ingredients">Ingredients</a></li>
    <li><a href="/#shop">Shop</a></li>
    <li><a href="/#testimonials">Reviews</a></li>
    <li><a href="/blogs">Blog</a></li>
    <li><a href="/#location">Find Us</a></li>
    <li><a href="/#contact">Contact</a></li>
  </ul>
  <div class="nav-right">
    <button id="themeToggleBtn" title="Toggle Theme" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--green-deep); margin-right:12px;">🌓</button>
    <div class="nav-user" id="navUserBtn" style="position:relative; cursor:pointer;" title="Account" onclick="event.stopPropagation(); toggleUserDropdown();">
      <div id="navUserIcon" style="display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; font-size:20px; color:var(--green-deep);">👤</div>
      <div class="user-dropdown" id="userDropdown" onclick="event.stopPropagation();">
        <div id="dropdownLoggedOutView">
          <button class="user-dropdown-item" onclick="document.getElementById('userDropdown').classList.remove('show');">🔐 Login / Sign Up</button>
        </div>
        <div id="dropdownLoggedInView" style="display: none;">
          <div class="user-dropdown-name" id="dropdownName"></div>
          <div class="user-dropdown-email" id="dropdownEmail"></div>
          <button class="user-dropdown-item" onclick="window.location.href='/';">🏠 Back to Store</button>

        </div>
      </div>
    </div>
    <div class="nav-cart" id="cartIcon" title="View Cart" onclick="window.location.href='/cart.html'">🛒<span class="cart-count" id="cartCount">0</span></div>

<style>
  .login-page-container {
    padding: 120px 20px 60px;
    min-height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
</style>
<div class="login-page-container">
  <div class="auth-modal" style="position:relative; transform: none; top: 0; left: 0; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 450px;">
    <div class="auth-logo">FARMERS FARM</div>
    <div class="auth-subtitle">Customer Portal</div>
    <div class="auth-divider"></div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-form="loginFormContainer">Login</button>
      <button class="auth-tab" data-form="signupFormContainer">Sign Up</button>
    </div>
    <div class="auth-error" id="authError"></div>
    <!-- LOGIN -->
    <form class="auth-form active" id="loginFormContainer" novalidate>
      <div id="otpLoginMode">
        <div id="otpStep1">
          <div class="auth-field"><label>Email</label><input type="email" id="clEmail" placeholder="your@email.com"></div>
          <button type="button" class="auth-btn" id="sendOtpBtn">Send OTP &rarr;</button>
        </div>
        <div id="otpStep2" style="display:none;">
          <div class="auth-field"><label>Enter OTP</label><input type="text" id="clOtp" placeholder="6-digit code"></div>
          <button type="submit" class="auth-btn" id="customerLoginForm">Verify OTP &amp; Login</button>
          <button type="button" id="changeOtpEmailBtn" style="background:none;border:none;color:var(--gold);font-size:12px;margin-top:8px;cursor:pointer;display:block;width:100%;text-align:center;">&larr; Change Email</button>
        </div>
      </div>

      <div id="passwordLoginMode" style="display:none;">
        <div class="auth-field"><label>Email</label><input type="email" id="clPassEmail" placeholder="your@email.com"></div>
        <div class="auth-field"><label>Password</label><input type="password" id="clPass" placeholder="Enter password"></div>
        <button type="submit" class="auth-btn" id="passwordLoginBtn">Sign In &rarr;</button>
      </div>

      <button type="button" id="toggleLoginModeBtn" style="background:none;border:none;color:var(--gold);font-size:12px;margin:10px auto 0;cursor:pointer;display:block;text-decoration:underline;">Or login with Password instead</button>
      
      <div style="text-align: center; margin: 14px 0; color: var(--mist); font-size: 12px;">OR</div>
      
      <!-- Dynamic Google Sign In Button -->
      <div id="googleSignInContainer" style="display: flex; justify-content: center; margin-bottom: 10px;"></div>
    </form>
    <!-- SIGNUP -->
    <form class="auth-form" id="signupFormContainer">
      <div class="auth-field"><label>Full Name</label><input type="text" id="csName" placeholder="Your full name" required></div>
      <div class="auth-field"><label>Email</label><input type="email" id="csEmail" placeholder="your@email.com" required></div>
      <div class="auth-field"><label>Phone</label><input type="tel" id="csPhone" placeholder="+91 98765 43210" required></div>
      <div class="auth-field"><label>Password</label><input type="password" id="csPass" placeholder="Create password" required></div>
      <button type="submit" class="auth-btn" id="customerSignupForm">Create Account &rarr;</button>
    </form>
  </div>
</div>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for(let registration of registrations) { registration.unregister(); }
    });
  }
  if ('caches' in window) {
    caches.keys().then(function(names) {
      for (let name of names) caches.delete(name);
    });
  }
</script>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
<script src="js/effects3d.js?v=1"></script>
<script src="js/app.js?v=10"></script>
</body>
</html>
